<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>New Tab</title>
    <style>
      /* Tokyo Night, with Tokyo Night Day for light mode. */
      :root {
        color-scheme: dark light;
        --bg: #1a1b26;
        --fg: #c0caf5;
        --dim: #828bb5;
        --line: #292e42;
        --panel: #16161e;
        --accent: #9ece6a;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #e1e2e7;
          --fg: #3760bf;
          --dim: #5a607d;
          --line: #c4c8da;
          --panel: #d5d6db;
          --accent: #485e30;
        }
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 44px;
        padding: 40px 24px;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      form { width: min(560px, 100%); }

      input {
        width: 100%;
        padding: 14px 18px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel);
        color: var(--fg);
        font: inherit;
        outline: none;
      }
      input:focus { border-color: var(--accent); }
      input::placeholder { color: var(--dim); }

      .sites {
        width: min(560px, 100%);
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 6px;
      }

      .sites a {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 9px 11px;
        border-radius: 8px;
        color: var(--fg);
        text-decoration: none;
        overflow: hidden;
      }
      .sites a:hover { background: var(--panel); }
      .sites img { width: 16px; height: 16px; flex: none; border-radius: 3px; }
      .sites span {
        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 44px;
        width: 100%;
      }

      /* Present to a screen reader, absent to everyone else. */
      .visually-hidden {
        position: absolute;
        width: 1px; height: 1px;
        margin: -1px; padding: 0; border: 0;
        clip-path: inset(50%);
        overflow: hidden;
        white-space: nowrap;
      }

      footer { color: var(--dim); font-size: 12px; }
      footer b { color: var(--accent); font-weight: 400; }
    </style>
  </head>
  <body>
    <main>
      <form id="search" role="search">
        <label class="visually-hidden" for="q">Search the web</label>
        <input
          id="q"
          name="q"
          type="search"
          placeholder="Search"
          autocomplete="off"
          spellcheck="false"
        />
      </form>

      <nav class="sites" id="sites" aria-label="Most visited"></nav>
    </main>

    <footer><b id="prefix">…</b> then <b>?</b> for the keys</footer>

    <script src="content/settings.js"></script>
    <script src="content/ui.js"></script>
    <script src="content/main.js"></script>
    <script src="newtab.js"></script>
  </body>
</html>
